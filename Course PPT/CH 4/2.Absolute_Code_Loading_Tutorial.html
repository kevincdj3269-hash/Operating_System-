
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Memory Management: Absolute Code Loading</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --accent: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { font-size: 1.5rem; margin: 0; }

        .btn-group { display: flex; gap: 10px; }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-reset { background: var(--accent); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .info-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 20px;
            margin-bottom: 40px;
            min-height: 80px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Animation Stage */
        .stage {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 400px;
            position: relative;
            background: #f1f5f9;
            border-radius: 12px;
            overflow: hidden;
        }

        .component {
            text-align: center;
            z-index: 2;
        }

        .box {
            width: 120px;
            height: 120px;
            background: white;
            border: 3px solid #cbd5e0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .memory-map {
            width: 180px;
            height: 320px;
            border: 4px solid #334155;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .mem-slot {
            height: 60px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
            position: relative;
        }

        .mem-slot::before {
            content: attr(data-addr);
            position: absolute;
            left: -60px;
            color: #64748b;
        }

        .mem-os { background: #334155; color: white; height: 100px; }

        /* The Animated Program Code */
        .program-block {
            width: 140px;
            height: 50px;
            background: var(--success);
            color: white;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            position: absolute;
            top: 150px;
            left: 100px;
            opacity: 0;
            transform: translateX(-100px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Animation States */
        .step-1 .program-block { opacity: 1; transform: translateX(0); }
        .step-2 .program-block { 
            opacity: 1; 
            left: calc(75% - 70px); /* Center over memory map */
            top: 200px; /* Aligned with 0x4000 address */
        }
        .step-3 .program-block {
            opacity: 1;
            left: calc(75% - 70px);
            top: 200px;
            box-shadow: 0 0 20px var(--success);
            border: 3px solid white;
        }

        .arrow {
            font-size: 2rem;
            color: #cbd5e0;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="ui-title">記憶體管理：絕對程式碼載入</h1>
        <div class="btn-group">
            <button class="btn-secondary" onclick="toggleLang()">EN / 中文</button>
            <button class="btn-reset" onclick="resetSim()">重置</button>
            <button class="btn-primary" id="next-btn" onclick="nextStep()">下一步</button>
        </div>
    </div>

    <div class="info-box" id="ui-desc">
        點擊「下一步」開始演繹。在此模式下，編譯器預設程式必須放在位址 0x4000。
    </div>

    <div class="stage" id="stage-container">
        <!-- Source Code Area -->
        <div class="component">
            <div class="box" style="border-color: var(--primary);">
                <span id="ui-comp">編譯器</span>
                <div style="font-size: 0.7rem; color: var(--primary); margin-top: 5px;">Compile Time</div>
            </div>
            <p style="font-size: 0.9rem; margin-top: 10px;" id="ui-src">原始碼</p>
        </div>

        <div class="arrow">➔</div>

        <!-- Memory Area -->
        <div class="component">
            <div class="memory-map">
                <div class="mem-slot mem-os">OS (作業系統)</div>
                <div class="mem-slot" data-addr="0x1000">空閒</div>
                <div class="mem-slot" data-addr="0x4000" id="target-slot"></div>
                <div class="mem-slot" data-addr="0x8000">空閒</div>
            </div>
            <p style="font-size: 0.9rem; margin-top: 10px;" id="ui-mem">實體記憶體</p>
        </div>

        <!-- Animated Elements -->
        <div class="program-block" id="prog-code">
            CODE (0x4000)
        </div>
    </div>
</div>

<script>
    const i18n = {
        'zh': {
            'title': '作業系統記憶體管理：絕對程式碼載入',
            'ui-comp': '編譯器',
            'ui-src': '原始碼檔案',
            'ui-mem': '實體記憶體',
            'desc-0': '<b>初始狀態：</b> 程式尚未編譯。在此模式下，開發者或編譯器必須預先知道記憶體的閒置位置。',
            'desc-1': '<b>步驟 1 (編譯)：</b> 編譯器將原始碼轉換為絕對程式碼，指令中所有的位址都被固定繫結到 <b>0x4000</b>。',
            'desc-2': '<b>步驟 2 (載入)：</b> 載入器將程式碼直接讀入記憶體的 0x4000 位址。過程不需任何修改，因為位址已經匹配。',
            'desc-3': '<b>步驟 3 (執行)：</b> CPU 跳轉到 0x4000。請注意：若此位址被佔用，程式將完全無法運作。'
        },
        'en': {
            'title': 'OS Memory Management: Absolute Code Loading',
            'ui-comp': 'Compiler',
            'ui-src': 'Source Code',
            'ui-mem': 'Physical Memory',
            'desc-0': '<b>Initial State:</b> Program is not compiled yet. In this mode, the address must be pre-determined.',
            'desc-1': '<b>Step 1 (Compile):</b> The compiler generates absolute code where all addresses are bound to <b>0x4000</b>.',
            'desc-2': '<b>Step 2 (Load):</b> The Loader copies code directly to memory address 0x4000. No relocation needed.',
            'desc-3': '<b>Step 3 (Execute):</b> CPU jumps to 0x4000. Note: If this address is occupied, the program cannot run.'
        }
    };

    let lang = 'zh';
    let step = 0;

    function toggleLang() {
        lang = lang === 'zh' ? 'en' : 'zh';
        updateUI();
    }

    function updateUI() {
        const t = i18n[lang];
        document.getElementById('ui-title').innerText = t['title'];
        document.getElementById('ui-comp').innerText = t['ui-comp'];
        document.getElementById('ui-src').innerText = t['ui-src'];
        document.getElementById('ui-mem').innerText = t['ui-mem'];
        document.getElementById('ui-desc').innerHTML = t[`desc-${step}`];
        
        const targetSlot = document.getElementById('target-slot');
        if (step >= 2) {
            targetSlot.innerText = lang === 'zh' ? '已佔用' : 'Occupied';
            targetSlot.style.color = 'var(--success)';
        } else {
            targetSlot.innerText = lang === 'zh' ? '閒置' : 'Free';
            targetSlot.style.color = '#94a3b8';
        }
    }

    function nextStep() {
        if (step < 3) {
            step++;
            document.getElementById('stage-container').className = 'stage step-' + step;
            if (step === 3) document.getElementById('next-btn').disabled = true;
            updateUI();
        }
    }

    function resetSim() {
        step = 0;
        document.getElementById('stage-container').className = 'stage';
        document.getElementById('next-btn').disabled = false;
        updateUI();
    }

    updateUI();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Memory Management: Relocatable Code Loading</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --main-text: #2c3e50;
            --os-color: #34495e;
            --memory-border: #bdc3c7;
            --code-bg: #3498db;
            --accent-color: #e74c3c;
            --btn-bg: #2ecc71;
            --btn-hover: #27ae60;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: var(--os-color); }

        .controls button {
            padding: 10px 18px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .controls button:active { transform: scale(0.95); }
        .btn-lang { background: #95a5a6; }
        .btn-reset { background: #e74c3c; }
        .btn-next { background: var(--btn-bg); }
        .btn-next:disabled { background: #bdc3c7; cursor: not-allowed; }

        .description {
            background: #fff3cd;
            border-left: 5px solid #f1c40f;
            padding: 15px 20px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            min-height: 60px;
            line-height: 1.5;
        }

        /* Simulation Area */
        .simulation {
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            height: 450px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            padding: 20px;
        }

        /* Object Code Block */
        .object-code {
            width: 160px;
            background: var(--code-bg);
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            padding: 10px;
            position: absolute;
            left: 50px;
            top: 150px;
            transition: all 1s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
        }

        .code-title {
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .instruction {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 5px;
            background: rgba(0,0,0,0.1);
            padding: 3px 5px;
            border-radius: 4px;
            transition: all 0.5s;
        }

        .addr { color: #f1c40f; font-weight: bold; }
        
        /* Loader/MMU */
        .loader-box {
            width: 140px;
            height: 100px;
            background: #f39c12;
            color: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            position: absolute;
            left: 50%;
            top: 20px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .base-reg {
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
        }

        /* Physical Memory */
        .memory {
            width: 220px;
            border: 4px solid var(--os-color);
            background: white;
            position: absolute;
            right: 50px;
            top: 50px;
            bottom: 50px;
            display: flex;
            flex-direction: column;
        }

        .mem-header {
            background: var(--os-color);
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: bold;
        }

        .mem-slot {
            flex-grow: 1;
            border-bottom: 1px solid var(--memory-border);
            display: flex;
            align-items: center;
            padding-left: 60px;
            position: relative;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .mem-slot::before {
            content: attr(data-addr);
            position: absolute;
            left: 5px;
            font-family: monospace;
            font-weight: bold;
            color: var(--os-color);
        }

        .mem-os { background: #bdc3c7; color: var(--os-color); font-weight: bold; flex-grow: 0.8; }
        
        /* Animation States */
        /* Step 1: Base Address Assigned */
        .step-1 .loader-box { opacity: 1; }
        
        /* Step 2: Code moves to Memory */
        .step-2 .loader-box { opacity: 1; }
        .step-2 .object-code {
            left: calc(100% - 270px); /* Align with memory */
            top: 195px; /* Align with 0x3000 slot */
        }
        
        /* Step 3: Relocation (Addresses change) */
        .step-3 .loader-box { opacity: 1; }
        .step-3 .object-code {
            left: calc(100% - 270px);
            top: 195px;
            background: #27ae60; /* Turn green to show success */
        }
        /* JS will update the text of .addr in Step 3 */

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="ui-title">記憶體管理：可重定址程式碼載入</h1>
        <div class="controls">
            <button class="btn-lang" onclick="toggleLang()">EN / 中文</button>
            <button class="btn-reset" onclick="resetSim()">重置</button>
            <button class="btn-next" id="btn-next" onclick="nextStep()">下一步</button>
        </div>
    </div>

    <div class="description" id="ui-desc">
        請點擊「下一步」開始。程式剛被編譯完成，所有位址都是從 0 開始的<b>邏輯位址 (相對位址)</b>。
    </div>

    <div class="simulation" id="sim-stage">
        
        <div class="object-code" id="obj-code">
            <div class="code-title" id="ui-code-title">目的碼 (邏輯位址)</div>
            <div class="instruction"><span class="addr" id="addr-1">0x0000</span><span>START</span></div>
            <div class="instruction"><span class="addr" id="addr-2">0x0010</span><span>LOAD A</span></div>
            <div class="instruction"><span class="addr" id="addr-3">0x0020</span><span>ADD B</span></div>
            <div class="instruction"><span class="addr" id="addr-4">0x0030</span><span>STORE C</span></div>
        </div>

        <div class="loader-box">
            <span id="ui-loader">載入器 / OS</span>
            <div class="base-reg"><span id="ui-base">基底:</span> 0x3000</div>
        </div>

        <div class="memory">
            <div class="mem-header" id="ui-mem-title">實體記憶體</div>
            <div class="mem-slot mem-os" data-addr="0x0000">OS 區塊</div>
            <div class="mem-slot" data-addr="0x1000">已佔用</div>
            <div class="mem-slot" data-addr="0x2000">已佔用</div>
            <div class="mem-slot" data-addr="0x3000" style="flex-grow: 1.5; background: #e8f8f5;">空閒區塊 (Target)</div>
            <div class="mem-slot" data-addr="0x4000">空閒區塊</div>
        </div>

    </div>
</div>

<script>
    const textData = {
        'zh': {
            'title': '作業系統記憶體管理：可重定址程式碼',
            'btn-next': '下一步',
            'btn-reset': '重置',
            'code-title': '目的碼 (邏輯位址)',
            'code-title-reloc': '載入完成 (實體位址)',
            'mem-title': '實體記憶體',
            'loader': '載入器 / OS',
            'base': '基底:',
            'desc-0': '<b>初始狀態：</b> 程式編譯完成，內部的位址都是從 0 開始的<b>邏輯位址 (相對位址)</b>。它還不知道未來會住在哪裡。',
            'desc-1': '<b>步驟 1 (尋找空間)：</b> 作業系統在實體記憶體中找到一塊從 <code>0x3000</code> 開始的空閒區塊。OS 將基底位址設定為 <code>0x3000</code>。',
            'desc-2': '<b>步驟 2 (載入)：</b> 載入器將整塊程式碼搬移到實體記憶體 <code>0x3000</code> 的位置。',
            'desc-3': '<b>步驟 3 (位址重定位)：</b> 系統進行重定位 (Relocation)。將所有的邏輯位址加上基底位址 0x3000 (例如 0x0010 變成 0x3010)。程式現在可以正確執行了！'
        },
        'en': {
            'title': 'OS Memory Management: Relocatable Code',
            'btn-next': 'Next Step',
            'btn-reset': 'Reset',
            'code-title': 'Object Code (Logical)',
            'code-title-reloc': 'Loaded (Physical)',
            'mem-title': 'Physical Memory',
            'loader': 'Loader / OS',
            'base': 'Base:',
            'desc-0': '<b>Initial State:</b> Program is compiled. All addresses are <b>Logical Addresses</b> starting from 0. The physical location is unknown yet.',
            'desc-1': '<b>Step 1 (Allocation):</b> The OS finds a free memory block starting at <code>0x3000</code>. It sets the Base Address to <code>0x3000</code>.',
            'desc-2': '<b>Step 2 (Loading):</b> The loader moves the program block into physical memory starting at <code>0x3000</code>.',
            'desc-3': '<b>Step 3 (Relocation):</b> Addresses are relocated. The system adds the Base Address (0x3000) to all logical addresses (e.g., 0x0010 becomes 0x3010). Program is ready to run!'
        }
    };

    let step = 0;
    let currentLang = 'zh';

    function toggleLang() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        updateUI();
    }

    function updateUI() {
        const langData = textData[currentLang];
        document.getElementById('ui-title').innerText = langData['title'];
        document.getElementById('btn-next').innerText = langData['btn-next'];
        document.getElementById('btn-reset').innerText = langData['btn-reset'];
        document.getElementById('ui-mem-title').innerText = langData['mem-title'];
        document.getElementById('ui-loader').innerText = langData['loader'];
        document.getElementById('ui-base').innerText = langData['base'];
        
        if(step < 3) {
            document.getElementById('ui-code-title').innerText = langData['code-title'];
        } else {
            document.getElementById('ui-code-title').innerText = langData['code-title-reloc'];
        }

        document.getElementById('ui-desc').innerHTML = langData[`desc-${step}`];
    }

    function updateAddresses(isPhysical) {
        document.getElementById('addr-1').innerText = isPhysical ? '0x3000' : '0x0000';
        document.getElementById('addr-2').innerText = isPhysical ? '0x3010' : '0x0010';
        document.getElementById('addr-3').innerText = isPhysical ? '0x3020' : '0x0020';
        document.getElementById('addr-4').innerText = isPhysical ? '0x3030' : '0x0030';
    }

    function nextStep() {
        if (step >= 3) return;
        step++;
        
        const stage = document.getElementById('sim-stage');
        stage.className = 'simulation step-' + step;

        if (step === 3) {
            updateAddresses(true); // Change to 0x3000+
            document.getElementById('btn-next').disabled = true;
        }

        updateUI();
    }

    function resetSim() {
        step = 0;
        document.getElementById('sim-stage').className = 'simulation';
        document.getElementById('btn-next').disabled = false;
        updateAddresses(false); // Reset to 0x0000
        updateUI();
    }

    // Initialize
    updateUI();
</script>

</body>
</html>

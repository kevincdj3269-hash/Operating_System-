<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Management: Single Partition</title>
    <style>
        :root {
            --os-color: #2c3e50;
            --user-color: #ecf0f1;
            --process-color: #3498db;
            --border-color: #bdc3c7;
            --text-main: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--os-color);
        }

        button {
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
            margin-left: 10px;
        }

        button:hover { background-color: #27ae60; }
        button.lang-btn { background-color: #95a5a6; }
        button.lang-btn:hover { background-color: #7f8c8d; }
        button.reset-btn { background-color: #e74c3c; }
        button.reset-btn:hover { background-color: #c0392b; }

        .description-box {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin-bottom: 30px;
            font-size: 1.1rem;
            min-height: 50px;
        }

        /* Animation & Layout Area */
        .simulation-area {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 20px;
            position: relative;
            height: 400px;
        }

        /* Memory Map Styling */
        .memory-map {
            width: 250px;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .os-block {
            height: 120px; /* Represents lower memory */
            background-color: var(--os-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 3px dashed #e74c3c;
            z-index: 2;
        }

        .user-block {
            flex-grow: 1; /* Represents the rest of memory */
            background-color: var(--user-color);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7f8c8d;
            font-weight: bold;
        }

        /* Process CSS Animation Styling */
        .process {
            width: 200px;
            height: 150px;
            background-color: var(--process-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: absolute;
            top: 200px;
            left: -300px; /* Start off-screen/queue */
            opacity: 0;
            /* Core of the CSS animation */
            transition: all 1s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 5;
        }

        /* Step Classes for JavaScript to toggle */
        /* Step 1: Process arrives in Queue */
        .process.step-1 {
            left: 0px; 
            opacity: 1;
        }
        /* Step 2: Process moves into Memory User Space */
        .process.step-2 {
            left: calc(50% + 25px); /* Move into the memory block */
            top: 150px; /* Align inside user space */
            transform: translateX(-50%);
            opacity: 1;
        }
        /* Step 3: Process completes and fades out */
        .process.step-3 {
            left: calc(50% + 25px);
            top: -100px; /* Moves up and out */
            transform: translateX(-50%);
            opacity: 0;
        }

        .queue-area {
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .queue-title {
            margin-bottom: 20px;
            font-weight: bold;
            color: #7f8c8d;
            text-align: center;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1 id="ui-title">記憶體管理：單一分割區配置</h1>
        <div>
            <button class="lang-btn" id="btn-lang" onclick="toggleLanguage()">EN / 中文</button>
            <button class="reset-btn" id="btn-reset" onclick="resetSimulation()">重置</button>
            <button id="btn-next" onclick="nextStep()">下一步</button>
        </div>
    </div>

    <div class="description-box" id="ui-desc">
        請點擊「下一步」開始演繹。初始狀態：記憶體區分為受保護的「作業系統區」與閒置的「使用者空間」。
    </div>

    <div class="simulation-area">
        <div class="queue-area">
            <div class="queue-title" id="ui-queue">等待佇列 (Job Queue)</div>
            <div class="process" id="anim-process">Process A</div>
        </div>

        <div class="memory-map">
            <div class="os-block" id="ui-os">OS (作業系統)</div>
            <div class="user-block" id="ui-user">
                <span style="position: absolute; top: 10px; width: 100%; text-align: center; font-size: 0.9rem;">Base Register Limit 限制線</span>
                使用者空間
            </div>
        </div>
    </div>
</div>

<script>
    // 雙語字典
    const i18n = {
        'zh': {
            'title': '作業系統記憶體管理：單一分割區配置',
            'btn-next': '下一步 (Next Step)',
            'btn-reset': '重置 (Reset)',
            'ui-queue': '等待佇列 (Job Queue)',
            'ui-os': 'OS (作業系統)',
            'ui-user': '使用者空間<br><br>(剩餘空間浪費)',
            'process': '行程 A (30MB)',
            'desc-0': '<b>初始狀態：</b> 記憶體分為受保護的「作業系統區」(16MB) 與閒置的「使用者空間」(48MB)。',
            'desc-1': '<b>步驟 1 (抵達)：</b> 新的使用者程式「行程 A」進入等待佇列，請求 30MB 記憶體。',
            'desc-2': '<b>步驟 2 (配置與執行)：</b> 行程 A 被載入單一使用者空間執行。請注意：剩餘的 18MB 空間無法被其他行程使用 (內部碎裂/空間浪費)。',
            'desc-3': '<b>步驟 3 (完成)：</b> 行程 A 執行完畢並釋放記憶體，系統準備迎接下一個行程。'
        },
        'en': {
            'title': 'OS Memory Management: Single Partition Allocation',
            'btn-next': 'Next Step',
            'btn-reset': 'Reset',
            'ui-queue': 'Job Queue',
            'ui-os': 'Operating System',
            'ui-user': 'User Space<br><br>(Unused Space Wasted)',
            'process': 'Process A (30MB)',
            'desc-0': '<b>Initial State:</b> Memory is divided into a protected OS area (16MB) and a single contiguous User Space (48MB).',
            'desc-1': '<b>Step 1 (Arrival):</b> A new user program, "Process A", arrives in the queue requesting 30MB.',
            'desc-2': '<b>Step 2 (Allocation & Execution):</b> Process A is loaded into the user space. Notice that the remaining 18MB cannot be used by any other process (Wasted Space).',
            'desc-3': '<b>Step 3 (Completion):</b> Process A completes execution and releases the memory. The system is ready for the next job.'
        }
    };

    let currentLang = 'zh';
    let currentStep = 0;

    function toggleLanguage() {
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        updateUI();
    }

    function updateUI() {
        const langData = i18n[currentLang];
        document.getElementById('ui-title').innerText = langData['title'];
        document.getElementById('btn-next').innerText = langData['btn-next'];
        document.getElementById('btn-reset').innerText = langData['btn-reset'];
        document.getElementById('ui-queue').innerText = langData['ui-queue'];
        document.getElementById('ui-os').innerText = langData['ui-os'];
        
        if(currentStep === 2) {
             document.getElementById('ui-user').innerHTML = '<span style="position: absolute; top: 10px; width: 100%; text-align: center; font-size: 0.9rem; color:#e74c3c;">Base Register</span>' + langData['ui-user'];
        } else {
             document.getElementById('ui-user').innerHTML = '<span style="position: absolute; top: 10px; width: 100%; text-align: center; font-size: 0.9rem; color:#e74c3c;">Base Register</span>' + (currentLang === 'zh' ? '使用者空間' : 'User Space');
        }

        document.getElementById('anim-process').innerText = langData['process'];
        document.getElementById('ui-desc').innerHTML = langData[`desc-${currentStep}`];
    }

    function nextStep() {
        const processEl = document.getElementById('anim-process');
        if (currentStep < 3) {
            currentStep++;
            // 清除舊的步驟 class
            processEl.classList.remove('step-1', 'step-2', 'step-3');
            // 加上新的步驟 class 觸發 CSS 動畫
            processEl.classList.add(`step-${currentStep}`);
            
            // 如果到了最後一步，禁用下一步按鈕
            if (currentStep === 3) {
                document.getElementById('btn-next').disabled = true;
                document.getElementById('btn-next').style.backgroundColor = '#95a5a6';
            }
        }
        updateUI();
    }

    function resetSimulation() {
        currentStep = 0;
        const processEl = document.getElementById('anim-process');
        processEl.classList.remove('step-1', 'step-2', 'step-3');
        document.getElementById('btn-next').disabled = false;
        document.getElementById('btn-next').style.backgroundColor = '#2ecc71';
        updateUI();
    }

    // 初始化 UI 語言
    updateUI();
</script>

</body>
</html>

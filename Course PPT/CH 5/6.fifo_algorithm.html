<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFO Page Replacement Algorithm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #4db8ff; }
        
        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007acc;
            color: white;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #005999; }
        button:active { transform: scale(0.97); }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        .animation-container {
            width: 800px;
            height: 400px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        /* 參考字串區 */
        .ref-string-container {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }
        .ref-box {
            width: 40px;
            height: 40px;
            background-color: #2d2d2d;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .ref-box.active {
            border-color: #ffeb3b;
            background-color: rgba(255, 235, 59, 0.2);
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.5);
            transform: scale(1.1);
        }

        /* 實體記憶體區 (RAM) */
        .ram-container {
            display: flex;
            gap: 20px;
            position: relative;
        }
        .frame {
            width: 80px;
            height: 100px;
            border: 3px dashed #4caf50;
            border-radius: 8px;
            background-color: rgba(76, 175, 80, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .page {
            width: 70px;
            height: 90px;
            background: linear-gradient(135deg, #2196f3, #1565c0);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(-50px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* FIFO 指標 (Victim Pointer) */
        .fifo-pointer {
            position: absolute;
            bottom: -40px;
            left: 30px; /* 會動態改變 */
            color: #f44336;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: left 0.5s ease-in-out;
        }
        .pointer-text { font-size: 14px; margin-top: 5px; }

        /* 狀態標籤 */
        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-fault { background-color: #f44336; color: white; }
        .status-hit { background-color: #4caf50; color: white; }

        .desc-box {
            width: 100%;
            max-width: 760px;
            background-color: #252526;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #4db8ff;
            font-size: 17px;
            line-height: 1.6;
            min-height: 90px;
        }

        .controls { margin-top: 25px; display: flex; gap: 15px; }
        code { background: #000; padding: 2px 6px; border-radius: 4px; color: #ffeb3b; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="title">FIFO 頁面替換演算法</h1>
        <button onclick="toggleLang()" id="langBtn">Switch to English</button>
    </div>

    <div class="animation-container">
        <div style="margin-bottom: 5px; color: #aaa; font-size: 14px;" id="lbl-ref">參考字串 (Reference String)</div>
        <div class="ref-string-container" id="ref-string">
            <div class="ref-box" id="ref-0">A</div>
            <div class="ref-box" id="ref-1">B</div>
            <div class="ref-box" id="ref-2">C</div>
            <div class="ref-box" id="ref-3">A</div>
            <div class="ref-box" id="ref-4">D</div>
            <div class="ref-box" id="ref-5">C</div>
        </div>

        <div style="margin-bottom: 10px; color: #4caf50; font-weight: bold;" id="lbl-ram">實體記憶體 (3 個頁框)</div>
        <div class="ram-container">
            <div class="frame"><div class="page" id="frame-0"></div></div>
            <div class="frame"><div class="page" id="frame-1"></div></div>
            <div class="frame"><div class="page" id="frame-2"></div></div>
            
            <div class="fifo-pointer" id="fifo-ptr">
                ▲
                <div class="pointer-text" id="lbl-victim">最舊 (Victim)</div>
            </div>
        </div>

        <div class="status-badge" id="status-badge">Page Fault</div>
    </div>

    <div class="desc-box" id="description">
        請點擊「下一步」開始演繹 FIFO 頁面替換演算法。
    </div>

    <div class="controls">
        <button onclick="prevStep()" id="prevBtn" disabled>上一步</button>
        <button onclick="nextStep()" id="nextBtn">下一步</button>
    </div>

    <script>
        let currentLang = 'zh';
        let currentStep = 0;
        const totalSteps = 6;

        // UI 節點
        const frames = [document.getElementById('frame-0'), document.getElementById('frame-1'), document.getElementById('frame-2')];
        const ptr = document.getElementById('fifo-ptr');
        const statusBadge = document.getElementById('status-badge');

        // 預先定義每一步的狀態 (Reference sequence: A, B, C, A, D, C)
        const timeline = [
            { ref: -1, mem: ['', '', ''], ptr: 0, status: '', zh: "<strong>初始狀態：</strong>記憶體有 3 個空的頁框 (Frames)。紅色指標指向第一個頁框，代表它將是第一個被填入、也是最老的空間。", en: "<strong>Initial State:</strong> 3 empty frames in memory. The red pointer indicates the first frame, which will be the oldest space once filled." },
            
            { ref: 0, mem: ['A', '', ''], ptr: 0, status: 'fault', 
              zh: "<strong>步驟 1：</strong>CPU 請求頁面 <code>A</code>。發生缺頁錯誤 (Page Fault)，將 A 載入記憶體。此時 <code>A</code> 是最舊的頁面，指標停留在 Frame 0。", 
              en: "<strong>Step 1:</strong> CPU requests Page <code>A</code>. Page Fault occurs. A is loaded. <code>A</code> is now the oldest page, pointer stays at Frame 0." },
            
            { ref: 1, mem: ['A', 'B', ''], ptr: 0, status: 'fault', 
              zh: "<strong>步驟 2：</strong>CPU 請求頁面 <code>B</code>。發生缺頁錯誤，載入 B。最舊的依然是 <code>A</code>，指標不變。", 
              en: "<strong>Step 2:</strong> CPU requests Page <code>B</code>. Page Fault. B is loaded. <code>A</code> is still the oldest, pointer remains unchanged." },
            
            { ref: 2, mem: ['A', 'B', 'C'], ptr: 0, status: 'fault', 
              zh: "<strong>步驟 3：</strong>CPU 請求頁面 <code>C</code>。發生缺頁錯誤，載入 C。此時記憶體已滿！最舊的頁面依然是 <code>A</code>。", 
              en: "<strong>Step 3:</strong> CPU requests Page <code>C</code>. Page Fault. C is loaded. Memory is now FULL! The oldest page is still <code>A</code>." },
            
            { ref: 3, mem: ['A', 'B', 'C'], ptr: 0, status: 'hit', 
              zh: "<strong>步驟 4：</strong>CPU 再次請求 <code>A</code>。因為 A 已經在記憶體中，發生 <strong>Page Hit (命中)</strong>！在 FIFO 中，即使 A 剛被存取過，它身為「最舊」的身份並不會改變，指標依然指向它。", 
              en: "<strong>Step 4:</strong> CPU requests <code>A</code> again. Since A is in memory, a <strong>Page Hit</strong> occurs! In FIFO, a recent access does not change its 'oldest' status. The pointer stays on A." },
            
            { ref: 4, mem: ['D', 'B', 'C'], ptr: 1, status: 'fault', 
              zh: "<strong>步驟 5：</strong>CPU 請求 <code>D</code>。記憶體已滿，觸發 FIFO 替換機制！紅色指標指向 <code>A</code>，因此 <strong>A 被踢出，替換成 D</strong>。此時最舊的頁面變成了 <code>B</code>，指標右移。", 
              en: "<strong>Step 5:</strong> CPU requests <code>D</code>. Memory is full. FIFO replacement triggers! The pointer indicates <code>A</code>, so <strong>A is evicted and replaced by D</strong>. The oldest page is now <code>B</code>, pointer shifts right." },
            
            { ref: 5, mem: ['D', 'B', 'C'], ptr: 1, status: 'hit', 
              zh: "<strong>步驟 6：</strong>CPU 請求 <code>C</code>。發生 <strong>Page Hit</strong>。狀態維持不變。如果接下來要載入新頁面，受害者將會是指標指向的 <code>B</code>。", 
              en: "<strong>Step 6:</strong> CPU requests <code>C</code>. <strong>Page Hit</strong> occurs. State remains unchanged. If a new page arrives next, the victim will be <code>B</code>." }
        ];

        const i18n = {
            zh: {
                title: "FIFO 頁面替換演算法",
                langBtn: "Switch to English",
                prevBtn: "上一步",
                nextBtn: "下一步",
                lblRef: "參考字串 (Reference String)",
                lblRam: "實體記憶體 (3 個頁框)",
                lblVictim: "最舊 (Victim)",
                statusHit: "命中 (Page Hit)",
                statusFault: "缺頁 (Page Fault)"
            },
            en: {
                title: "FIFO Page Replacement Algorithm",
                langBtn: "切換至中文",
                prevBtn: "Previous",
                nextBtn: "Next",
                lblRef: "Reference String",
                lblRam: "Physical Memory (3 Frames)",
                lblVictim: "Oldest (Victim)",
                statusHit: "Page Hit",
                statusFault: "Page Fault"
            }
        };

        function updateUI() {
            // 文字切換
            document.getElementById('title').innerText = i18n[currentLang].title;
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
            document.getElementById('prevBtn').innerText = i18n[currentLang].prevBtn;
            document.getElementById('nextBtn').innerText = i18n[currentLang].nextBtn;
            document.getElementById('lbl-ref').innerText = i18n[currentLang].lblRef;
            document.getElementById('lbl-ram').innerText = i18n[currentLang].lblRam;
            document.getElementById('lbl-victim').innerText = i18n[currentLang].lblVictim;
            
            const state = timeline[currentStep];
            document.getElementById('description').innerHTML = currentLang === 'zh' ? state.zh : state.en;

            // 按鈕狀態
            document.getElementById('prevBtn').disabled = currentStep === 0;
            document.getElementById('nextBtn').disabled = currentStep === totalSteps;

            // 更新參考字串高亮
            for(let i=0; i<6; i++) {
                const box = document.getElementById('ref-' + i);
                if(i === state.ref) box.classList.add('active');
                else box.classList.remove('active');
            }

            // 更新記憶體內容與動畫
            for(let i=0; i<3; i++) {
                const frame = frames[i];
                if(state.mem[i] !== '') {
                    frame.innerText = state.mem[i];
                    frame.classList.add('visible');
                    // 若是剛替換的頁面，給予短暫高亮
                    if(state.status === 'fault' && timeline[currentStep-1] && timeline[currentStep-1].mem[i] !== state.mem[i]) {
                        frame.style.background = 'linear-gradient(135deg, #ff9800, #f57c00)';
                        setTimeout(() => { frame.style.background = 'linear-gradient(135deg, #2196f3, #1565c0)'; }, 500);
                    }
                } else {
                    frame.classList.remove('visible');
                }
            }

            // 更新指標位置 (間距約 100px)
            ptr.style.left = (30 + state.ptr * 100) + 'px';

            // 更新狀態提示標籤
            if(state.status === 'hit') {
                statusBadge.innerText = i18n[currentLang].statusHit;
                statusBadge.className = 'status-badge status-hit';
                statusBadge.style.opacity = 1;
            } else if (state.status === 'fault') {
                statusBadge.innerText = i18n[currentLang].statusFault;
                statusBadge.className = 'status-badge status-fault';
                statusBadge.style.opacity = 1;
            } else {
                statusBadge.style.opacity = 0;
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        }

        // 初始載入
        updateUI();
    </script>
</body>
</html>

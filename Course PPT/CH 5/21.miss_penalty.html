<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Penalty (Page Fault Handling) Animation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 950px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 24px; color: #ff5252; }
        
        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #007acc;
            color: white;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #005999; }
        button:active { transform: scale(0.97); }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; }

        .animation-container {
            width: 950px;
            background-color: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            box-sizing: border-box;
            position: relative;
        }

        /* 系統狀態面板 */
        .status-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .cpu-box {
            background: #252526;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
        }
        .cpu-title { font-size: 18px; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .cpu-status { font-size: 24px; font-weight: bold; color: #4caf50; font-family: monospace; transition: color 0.3s; }
        .cpu-status.halted { color: #f44336; }

        .timer-box {
            background: #111;
            border: 1px dashed #ff5252;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60%;
        }
        .timer-title { color: #ff5252; font-weight: bold; margin-bottom: 5px; }
        .timer-val { font-size: 32px; font-family: monospace; color: #ffeb3b; }

        /* 時間軸 / 處理階段 */
        .timeline-container {
            width: 100%;
            display: flex;
            height: 120px;
            background: #2d2d2d;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .stage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            border-right: 2px solid #111;
            transition: all 0.3s;
            opacity: 0.3; /* 未啟動時變暗 */
        }
        .stage.active { opacity: 1; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2) inset; }
        
        .stage-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; text-align: center; line-height: 1.2; }
        .stage-time { font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }

        /* 三個階段的不成比例寬度設計 (突顯 Disk I/O 的龐大) */
        .stage-1 { width: 15%; background: linear-gradient(180deg, #ff9800, #e65100); }
        .stage-2 { width: 70%; background: linear-gradient(180deg, #9c27b0, #6a1b9a); }
        .stage-3 { width: 15%; background: linear-gradient(180deg, #03a9f4, #0277bd); border-right: none; }

        /* 處理進度條 (疊加在 Timeline 上) */
        .progress-bar {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 0%;
            background: rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        /* 硬碟 I/O 動畫特效 */
        .io-gears {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            opacity: 0;
        }
        .gear {
            width: 20px; height: 20px;
            border: 3px dashed #fff;
            border-radius: 50%;
        }
        .spin { animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .desc-box {
            width: 100%;
            max-width: 910px;
            background-color: #252526;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #ff5252;
            font-size: 17px;
            line-height: 1.6;
            min-height: 110px;
        }

        .controls { margin-top: 25px; display: flex; gap: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="title">需求分頁：失誤代價 (Miss Penalty) 剖析</h1>
        <button onclick="toggleLang()" id="langBtn">Switch to English</button>
    </div>

    <div class="animation-container">
        
        <div class="status-panel">
            <div class="cpu-box">
                <div class="cpu-title" id="lbl-cpu">CPU 狀態</div>
                <div class="cpu-status" id="val-cpu">RUNNING</div>
            </div>
            
            <div class="timer-box">
                <div class="timer-title" id="lbl-timer">失誤代價累計耗時 (Miss Penalty Time)</div>
                <div class="timer-val" id="val-timer">0 ns</div>
            </div>
        </div>

        <div class="timeline-container">
            <div class="progress-bar" id="progress"></div>

            <div class="stage stage-1" id="stg-1">
                <div class="stage-title" id="lbl-s1">階段一：<br>中斷與陷入<br>(Interrupt)</div>
                <div class="stage-time">~10,000 ns</div>
            </div>

            <div class="stage stage-2" id="stg-2">
                <div class="io-gears" id="gears">
                    <div class="gear spin"></div><div class="gear spin"></div><div class="gear spin"></div>
                </div>
                <div class="stage-title" id="lbl-s2">階段二：磁碟 I/O (Page In/Out) - 效能瓶頸</div>
                <div class="stage-time">~24,980,000 ns (佔 99.9%)</div>
            </div>

            <div class="stage stage-3" id="stg-3">
                <div class="stage-title" id="lbl-s3">階段三：<br>更新與重啟<br>(Restart)</div>
                <div class="stage-time">~10,000 ns</div>
            </div>
        </div>

    </div>

    <div class="desc-box" id="description">
        請點擊「下一步」開始演繹 Page Fault 發生時的代價。
    </div>

    <div class="controls">
        <button onclick="prevStep()" id="prevBtn" disabled>上一步</button>
        <button onclick="nextStep()" id="nextBtn">下一步</button>
    </div>

    <script>
        let currentLang = 'zh';
        let currentStep = 0;
        const totalSteps = 6;

        // UI 節點
        const valCpu = document.getElementById('val-cpu');
        const valTimer = document.getElementById('val-timer');
        const progress = document.getElementById('progress');
        const stg1 = document.getElementById('stg-1');
        const stg2 = document.getElementById('stg-2');
        const stg3 = document.getElementById('stg-3');
        const gears = document.getElementById('gears');

        const i18n = {
            zh: {
                title: "需求分頁：失誤代價 (Miss Penalty) 剖析",
                langBtn: "Switch to English",
                prevBtn: "上一步",
                nextBtn: "下一步",
                lblCpu: "CPU 狀態", lblTimer: "失誤代價累計耗時 (Miss Penalty Time)",
                lblS1: "階段一：<br>中斷與陷入<br>(Interrupt)",
                lblS2: "階段二：磁碟 I/O (Page In/Out) - 效能絕對瓶頸",
                lblS3: "階段三：<br>更新與重啟<br>(Restart)",
                cpuRun: "執行中 (RUNNING)", cpuHalt: "暫停等待 (HALTED)",
                steps: [
                    "<strong>初始狀態：</strong>CPU 正在正常執行程式碼。如果發生 Page Hit，資料存取只要 100 ns。但我們現在要觀察的是如果發生「未擊中 (Page Fault)」會付出什麼代價。",
                    "<strong>事件發生 (Page Fault)：</strong>CPU 發現需要的資料不在實體記憶體中。MMU 觸發缺頁中斷，漫長的「失誤代價」旅程開始了！",
                    "<strong>階段一 (中斷處理)：</strong>CPU 必須停下目前工作，儲存狀態 (Context Switch)，並將控制權交給作業系統核心。這是純軟體與 CPU 運作，耗時約 10,000 ns。",
                    "<strong>階段二 (磁碟 I/O - 噩夢開始)：</strong>作業系統查出分頁在硬碟的位置，並發出 I/O 請求。硬碟的物理讀寫極度緩慢。這段時間 CPU 只能閒置或切換給別人。耗時高達 24,980,000 ns (近 25 毫秒)。",
                    "<strong>階段三 (重啟行程)：</strong>資料終於載入 RAM！作業系統更新分頁表，恢復行程狀態，並要求 CPU <strong>重新執行</strong>剛才那行引發中斷的指令。耗時約 10,000 ns。",
                    "<strong>總結：</strong>總失誤代價高達 25,000,000 ns！請看上方時間軸的比例，磁碟 I/O 佔據了 99.9% 的時間。與正常 RAM 存取 (100 ns) 相比，速度慢了 <strong>25 萬倍</strong>！這就是為什麼必須竭盡全力避免 Page Fault。"
                ]
            },
            en: {
                title: "Miss Penalty (Page Fault Handling) Anatomy",
                langBtn: "切換至中文",
                prevBtn: "Previous",
                nextBtn: "Next",
                lblCpu: "CPU Status", lblTimer: "Cumulative Miss Penalty Time",
                lblS1: "Stage 1:<br>Interrupt<br>& Trap",
                lblS2: "Stage 2: Disk I/O (Swapping) - The Absolute Bottleneck",
                lblS3: "Stage 3:<br>Update &<br>Restart",
                cpuRun: "RUNNING", cpuHalt: "HALTED (WAITING)",
                steps: [
                    "<strong>Initial State:</strong> CPU is executing normally. A Page Hit takes 100 ns. But we are going to observe the massive penalty paid when a 'Miss (Page Fault)' occurs.",
                    "<strong>Event (Page Fault):</strong> CPU realizes required data is not in RAM. MMU triggers a page fault interrupt. The long journey of the 'Miss Penalty' begins!",
                    "<strong>Stage 1 (Interrupt Handling):</strong> CPU halts work, saves state (Context Switch), and traps to the OS kernel. This is software/CPU work, taking ~10,000 ns.",
                    "<strong>Stage 2 (Disk I/O - The Nightmare):</strong> OS locates the page on disk and issues an I/O request. Physical disk access is excruciatingly slow. CPU waits or context switches. Takes a massive 24,980,000 ns (~25 ms).",
                    "<strong>Stage 3 (Restart Process):</strong> Data is finally in RAM! OS updates the Page Table, restores process state, and instructs CPU to <strong>restart</strong> the instruction that caused the fault. Takes ~10,000 ns.",
                    "<strong>Summary:</strong> Total miss penalty is 25,000,000 ns! Look at the timeline proportions: Disk I/O consumes 99.9% of the time. Compared to a normal RAM access (100 ns), it's <strong>250,000 times slower</strong>! This is why avoiding Page Faults is paramount."
                ]
            }
        };

        function resetStages() {
            stg1.className = 'stage stage-1';
            stg2.className = 'stage stage-2';
            stg3.className = 'stage stage-3';
            gears.style.opacity = 0;
            progress.style.transition = 'none';
        }

        function updateUI() {
            document.getElementById('title').innerText = i18n[currentLang].title;
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
            document.getElementById('prevBtn').innerText = i18n[currentLang].prevBtn;
            document.getElementById('nextBtn').innerText = i18n[currentLang].nextBtn;
            
            document.getElementById('lbl-cpu').innerText = i18n[currentLang].lblCpu;
            document.getElementById('lbl-timer').innerText = i18n[currentLang].lblTimer;
            document.getElementById('lbl-s1').innerHTML = i18n[currentLang].lblS1;
            document.getElementById('lbl-s2').innerHTML = i18n[currentLang].lblS2;
            document.getElementById('lbl-s3').innerHTML = i18n[currentLang].lblS3;

            document.getElementById('description').innerHTML = i18n[currentLang].steps[currentStep];

            document.getElementById('prevBtn').disabled = currentStep === 0;
            document.getElementById('nextBtn').disabled = currentStep === totalSteps - 1;

            resetStages();

            switch(currentStep) {
                case 0:
                    valCpu.innerText = currentLang === 'zh' ? i18n.zh.cpuRun : i18n.en.cpuRun;
                    valCpu.className = 'cpu-status';
                    valTimer.innerText = "0 ns";
                    progress.style.width = "0%";
                    break;
                case 1:
                    valCpu.innerText = "PAGE FAULT!";
                    valCpu.className = 'cpu-status halted';
                    valTimer.innerText = "0 ns";
                    progress.style.width = "0%";
                    break;
                case 2: // Stage 1
                    valCpu.innerText = currentLang === 'zh' ? i18n.zh.cpuHalt : i18n.en.cpuHalt;
                    valCpu.className = 'cpu-status halted';
                    stg1.classList.add('active');
                    
                    progress.style.transition = 'width 0.5s linear';
                    progress.style.width = "15%"; // 視覺進度
                    valTimer.innerText = "10,000 ns";
                    break;
                case 3: // Stage 2 (慢速動畫)
                    valCpu.innerText = currentLang === 'zh' ? i18n.zh.cpuHalt : i18n.en.cpuHalt;
                    valCpu.className = 'cpu-status halted';
                    stg2.classList.add('active');
                    gears.style.opacity = 1;
                    
                    progress.style.transition = 'width 3s linear'; // 故意放慢
                    progress.style.width = "85%";
                    
                    // 模擬計時器狂跳
                    let count = 10000;
                    const interval = setInterval(() => {
                        count += 500000;
                        if(count > 24990000) { clearInterval(interval); valTimer.innerText = "24,990,000 ns"; }
                        else { valTimer.innerText = count.toLocaleString() + " ns"; }
                    }, 50);
                    break;
                case 4: // Stage 3
                    valCpu.innerText = currentLang === 'zh' ? i18n.zh.cpuHalt : i18n.en.cpuHalt;
                    valCpu.className = 'cpu-status halted';
                    stg3.classList.add('active');
                    
                    progress.style.transition = 'width 0.5s linear';
                    progress.style.width = "100%";
                    valTimer.innerText = "25,000,000 ns";
                    break;
                case 5: // 重啟
                    valCpu.innerText = currentLang === 'zh' ? i18n.zh.cpuRun : i18n.en.cpuRun;
                    valCpu.className = 'cpu-status';
                    progress.style.width = "100%";
                    valTimer.innerText = "25,000,000 ns";
                    break;
            }
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateUI();
        }

        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        }

        // 初始載入
        updateUI();
    </script>
</body>
</html>
